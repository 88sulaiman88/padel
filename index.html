<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بطولة الشقة للبادل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --court:#0C3654;
    --court-deep:#08283F;
    --panel:#11486B;
    --panel-soft:#0F4062;
    --line:rgba(233,244,240,.62);
    --line-soft:rgba(233,244,240,.16);
    --ball:#D9F24B;
    --ball-deep:#9DB733;
    --chalk:#EDF4F1;
    --muted:#8CB2C8;
    --alert:#F2705E;
    --r:14px;
    --display:"Readex Pro",system-ui,sans-serif;
    --body:"IBM Plex Sans Arabic",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--court);
    background-image:radial-gradient(120% 60% at 50% -10%, #16537A 0%, var(--court) 55%, var(--court-deep) 100%);
    background-attachment:fixed;
    color:var(--chalk);
    font-family:var(--body);
    font-size:15px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{max-width:940px;margin:0 auto;padding:0 16px 72px}

  /* ---------- header ---------- */
  .topbar{position:sticky;top:0;z-index:20;background:rgba(8,40,63,.9);backdrop-filter:blur(10px);border-bottom:2px solid var(--line)}
  .topbar-in{max-width:940px;margin:0 auto;padding:14px 16px 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto}
  .brand h1{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.2px;margin:0}
  .brand span{display:block;font-size:11.5px;color:var(--muted);font-weight:400;letter-spacing:.4px}
  .ball{
    width:22px;height:22px;border-radius:50%;flex:none;padding:0;border:0;cursor:pointer;
    background:radial-gradient(circle at 32% 30%, #EAFF7A, var(--ball) 55%, var(--ball-deep));
    box-shadow:0 0 0 1.5px rgba(0,0,0,.25) inset;transition:transform .16s, box-shadow .2s;
  }
  .ball:hover{transform:scale(1.14)}
  .ball:active{transform:scale(.94)}
  .ball:focus-visible{outline:2px solid var(--ball);outline-offset:3px}
  .ball.live{box-shadow:0 0 0 1.5px rgba(0,0,0,.25) inset, 0 0 0 3px rgba(217,242,75,.28)}

  .sync{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
  .sync b{width:6px;height:6px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
  .sync.ok b{background:var(--ball)}
  .sync.saving b{background:var(--ball);animation:pulse 1s infinite}
  .sync.warn b{background:#F2C14E}
  .sync.err b{background:var(--alert)}
  .sync.err{color:#FFC9C0}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  nav{display:flex;gap:2px;width:100%;margin-top:12px}
  nav button{
    flex:1;appearance:none;background:transparent;border:0;border-bottom:3px solid transparent;
    color:var(--muted);font-family:var(--display);font-weight:500;font-size:14px;padding:10px 4px 11px;cursor:pointer;
    transition:color .18s,border-color .18s;
  }
  nav button:hover{color:var(--chalk)}
  nav button[aria-selected="true"]{color:var(--ball);border-bottom-color:var(--ball)}
  nav button:focus-visible{outline:2px solid var(--ball);outline-offset:-4px;border-radius:6px}

  /* ---------- generic ---------- */
  h2.sec{font-family:var(--display);font-weight:600;font-size:15px;margin:26px 0 12px;display:flex;align-items:center;gap:10px;color:var(--chalk)}
  h2.sec::after{content:"";flex:1;height:1px;background:var(--line-soft)}
  .hint{color:var(--muted);font-size:13px;margin:0 0 14px}
  .mono{font-family:var(--mono)}
  .card{background:var(--panel-soft);border:1px solid var(--line-soft);border-radius:var(--r);padding:16px}
  .btn{
    appearance:none;cursor:pointer;font-family:var(--display);font-weight:500;font-size:13.5px;padding:10px 16px;border-radius:10px;
    border:1px solid var(--line-soft);background:rgba(237,244,241,.07);color:var(--chalk);
    transition:background .16s,border-color .16s,transform .06s;
  }
  .btn:hover{background:rgba(237,244,241,.14)}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:2px solid var(--ball);outline-offset:2px}
  .btn.primary{background:var(--ball);color:#12250B;border-color:var(--ball);font-weight:600}
  .btn.primary:hover{background:#E4FA63}
  .btn.danger{color:var(--alert);border-color:rgba(242,112,94,.4)}
  .btn.danger:hover{background:rgba(242,112,94,.14)}
  .btn.tiny{padding:5px 11px;font-size:12px;border-radius:8px}
  .btn[disabled]{opacity:.4;cursor:not-allowed}
  .row{display:flex;flex-wrap:wrap;gap:10px}
  .headline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 14px}
  .headline .hint{margin:0}

  .empty{text-align:center;padding:52px 20px;border:2px dashed var(--line-soft);border-radius:var(--r);color:var(--muted);margin-top:24px}
  .empty strong{display:block;font-family:var(--display);color:var(--chalk);font-size:16px;margin-bottom:6px}

  #banner{display:none;margin:14px 0 0;padding:10px 14px;border-radius:10px;font-size:13px;background:rgba(242,112,94,.14);border:1px solid rgba(242,112,94,.45);color:#FFD3CB}
  #banner.on{display:block}

  /* ---------- rounds ---------- */
  .round-head{display:flex;align-items:baseline;gap:12px;margin:28px 0 12px}
  .round-head .n{font-family:var(--mono);font-size:12px;color:var(--court-deep);background:var(--ball);padding:2px 9px;border-radius:999px;font-weight:600}
  .round-head .t{font-family:var(--display);font-weight:600;font-size:15px}
  .round-head .s{font-size:12px;color:var(--muted);margin-inline-start:auto;font-family:var(--mono)}

  .courts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:720px){.courts{grid-template-columns:1fr}}

  .match{background:var(--panel);border-radius:var(--r);overflow:hidden;border:1px solid var(--line-soft)}
  .match-top{display:flex;align-items:center;gap:8px;padding:9px 13px;background:rgba(8,40,63,.45);border-bottom:1px solid var(--line-soft)}
  .court-tag{font-family:var(--mono);font-size:11px;letter-spacing:.5px;color:var(--muted)}
  .status{margin-inline-start:auto;font-size:11px;font-family:var(--mono);color:var(--muted)}
  .final{margin-inline-start:auto;font-family:var(--mono);font-size:13px;font-weight:600;color:var(--court-deep);background:var(--ball);padding:1px 9px;border-radius:999px;letter-spacing:.5px}

  .court{position:relative;display:grid;grid-template-columns:1fr 1fr;margin:14px 13px;border:2px solid var(--line);border-radius:4px;background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,0))}
  .court::before{content:"";position:absolute;inset:0;right:50%;width:0;border-inline-end:2px dashed var(--line)}
  .court.pick{margin-bottom:10px}
  .side{padding:14px 10px;text-align:center;min-height:96px;display:flex;flex-direction:column;justify-content:center;gap:3px}
  .side p{margin:0;font-size:14px;font-weight:500;line-height:1.45}
  .side .amp{color:var(--muted);font-size:11px;margin:1px 0}
  .side.win{background:rgba(217,242,75,.1)}
  .side.win p{color:var(--ball)}
  .side .pts{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px}
  .side.win .pts{color:var(--ball-deep)}
  button.side{appearance:none;border:0;background:transparent;color:inherit;font-family:inherit;cursor:pointer;width:100%;transition:background .15s}
  button.side:hover{background:rgba(237,244,241,.07)}
  button.side.win:hover{background:rgba(217,242,75,.16)}
  button.side:focus-visible{outline:2px solid var(--ball);outline-offset:-3px}
  button.side .tap{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:6px;opacity:.75}

  .pickbar{padding:0 13px 14px}
  .seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line-soft);border-radius:9px;overflow:hidden}
  .seg button{appearance:none;border:0;background:transparent;color:var(--muted);cursor:pointer;font-family:var(--mono);font-size:13px;font-weight:600;padding:10px 0;transition:background .15s,color .15s}
  .seg button + button{border-inline-start:1px solid var(--line-soft)}
  .seg button:nth-child(3){border-inline-start:2px dashed var(--line)}
  .seg button:hover{color:var(--chalk);background:rgba(237,244,241,.08)}
  .seg button[aria-pressed="true"]{background:var(--ball);color:#12250B}
  .seg button:focus-visible{outline:2px solid var(--ball);outline-offset:-2px}
  .clear{display:block;margin:10px auto 0;appearance:none;background:transparent;border:0;color:var(--muted);cursor:pointer;font-family:var(--body);font-size:12px;padding:4px 8px;text-decoration:underline;text-underline-offset:3px}
  .clear:hover{color:var(--alert)}
  .clear:focus-visible{outline:2px solid var(--ball);outline-offset:2px;border-radius:6px}

  /* ---------- standings ---------- */
  .table{width:100%;border-collapse:collapse;font-size:14px}
  .table thead th{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.6px;color:var(--muted);text-align:center;padding:0 6px 9px;border-bottom:2px solid var(--line);white-space:nowrap}
  .table thead th.name{text-align:right}
  .table td{padding:12px 6px;text-align:center;border-bottom:1px solid var(--line-soft);font-family:var(--mono);font-size:13px;color:var(--muted)}
  .table td.name{text-align:right;font-family:var(--body);font-size:15px;color:var(--chalk);font-weight:500}
  .table td.rank{width:34px;font-size:12px}
  .table td.sets{direction:ltr;unicode-bidi:isolate}
  .table td.pts{color:var(--chalk);font-size:17px;font-weight:600}
  .table tr.lead td.rank,.table tr.lead td.pts{color:var(--ball)}
  .table tr.lead td.name::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--ball);margin-inline-start:8px;vertical-align:middle}
  .legend{margin-top:22px;font-size:13px;color:var(--muted)}
  .legend ul{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:7px}
  .legend li{display:flex;align-items:center;gap:10px}
  .legend .k{font-family:var(--mono);font-size:11px;background:rgba(237,244,241,.08);border:1px solid var(--line-soft);padding:2px 8px;border-radius:6px;color:var(--chalk);min-width:74px;text-align:center}

  /* ---------- gate + admin ---------- */
  .gate{max-width:360px;margin:48px auto 0;text-align:center}
  .gate .mark{width:40px;height:40px;border-radius:50%;margin:0 auto 18px;background:radial-gradient(circle at 32% 30%, #EAFF7A, var(--ball) 55%, var(--ball-deep))}
  .gate h3{font-family:var(--display);font-weight:600;font-size:18px;margin:0 0 8px}
  .gate .sub{color:var(--muted);font-size:13px;margin:0 0 22px;line-height:1.7}
  .code{width:100%;background:rgba(8,40,63,.55);border:1px solid var(--line-soft);border-radius:11px;color:var(--chalk);font-family:var(--mono);font-size:19px;letter-spacing:5px;text-align:center;padding:13px 0}
  .code:focus{outline:none;border-color:var(--ball)}
  .gate .btn{width:100%;margin-top:14px;padding:12px}
  .gate .err{color:#FFD3CB;font-size:12.5px;min-height:20px;margin:12px 0 0}

  .players{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:600px){.players{grid-template-columns:1fr}}
  .pfield{display:flex;align-items:center;gap:10px;background:rgba(8,40,63,.4);border:1px solid var(--line-soft);border-radius:10px;padding:4px 12px}
  .pfield i{font-family:var(--mono);font-style:normal;font-size:11px;color:var(--muted);width:16px}
  .pfield input{flex:1;background:transparent;border:0;color:var(--chalk);font-family:var(--body);font-size:15px;padding:9px 0}
  .pfield input:focus{outline:none}
  .pfield:focus-within{border-color:var(--ball)}
  .admin-note{font-size:12.5px;color:var(--muted);margin:12px 0 0;line-height:1.7}
  .stack{display:grid;gap:12px}
  .adminbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:22px}
  .adminbar .who{font-family:var(--mono);font-size:11px;color:var(--muted);margin-inline-end:auto}
  .tokenfield{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .tokenfield input{
    flex:1;min-width:200px;background:rgba(8,40,63,.5);border:1px solid var(--line-soft);border-radius:10px;
    color:var(--chalk);font-family:var(--mono);font-size:13px;padding:10px 12px;
  }
  .tokenfield input:focus{outline:none;border-color:var(--ball)}
  a{color:var(--ball)}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <button class="ball" id="adminkey" type="button" aria-label="الإدارة" title="الإدارة"></button>
      <div>
        <h1>بطولة الشقة للبادل</h1>
        <span>الترتيب والجولات</span>
      </div>
    </div>
    <div class="sync" id="sync"><b></b><span>جارٍ التحميل…</span></div>
    <nav role="tablist">
      <button role="tab" data-view="standings" aria-selected="true">الترتيب</button>
      <button role="tab" data-view="matches" aria-selected="false">المباريات</button>
    </nav>
  </div>
</header>

<div class="wrap">
  <div id="banner"></div>
  <main id="app" aria-live="polite"><p class="hint" style="margin-top:28px">جارٍ تحميل البطولة…</p></main>
</div>

<script>
(function(){
  "use strict";

  /* ================= إعدادات المستودع ================= */
  var GH = { owner:"88sulaiman88", repo:"padel", branch:"main", path:"data.json" };
  var API = "https://api.github.com/repos/" + GH.owner + "/" + GH.repo + "/contents/" + GH.path;
  var LOCAL_KEY = "padel_state_v2";
  var POLL_MS = 120000;               // دقيقتان — تحت سقف ٦٠ طلباً/ساعة

  /* ================= خزنة التوكن =================
     التوكن ينحفظ مشفَّراً (AES-GCM 256) داخل data.json، ومفتاحه مشتق من الرمز عبر PBKDF2-SHA256 بـ ٣١٠ آلاف تكرار مع مِلح عشوائي.
     لا التوكن ولا الرمز موجودان في هذا الملف، والتحقق يتم بنجاح فكّ التشفير:
     الرمز الخاطئ يفشل رياضياً، فما فيه هاش يُقارَن ولا سر يُقرأ من السورس.
     ملاحظة: قوة الحماية = قوة الرمز. رمز قصير يعني أن من يقرأ الملف
     يقدر يستخرج التوكن بالمحاولة، فاجعل صلاحية التوكن قصيرة وجدّده عند الحاجة. */
  var ITER = 600000;                  // تشفير الخزنة
  /* تحقق الرمز: ناتج PBKDF2-SHA256 (٣١٠ آلاف تكرار). الرمز نفسه ليس في الملف. */
  var AUTH_SALT = "7f3ac1e9d2b84605padel";
  var AUTH_HASH = "ffaf5be3e66c0906bb4679b3d0d82d8b324a4b80a6541e92e2e32084e6ecbcfb";
  var AUTH_ITER = 310000;

  var ROTATION = [
    [[[0,1],[2,3]], [[4,5],[6,7]]],
    [[[0,2],[1,3]], [[4,6],[5,7]]],
    [[[0,3],[1,2]], [[4,7],[5,6]]],
    [[[0,4],[2,6]], [[1,5],[3,7]]],
    [[[0,5],[3,6]], [[1,4],[2,7]]],
    [[[0,6],[1,7]], [[2,4],[3,5]]],
    [[[0,7],[2,5]], [[1,6],[3,4]]]
  ];

  var state = { players: [], schedule: [], vault: null };
  var view = "standings";
  var unlocked = false;
  var tries = 0, blockUntil = 0;
  var vaultPane = null;
  var sessionCode = "";
  var sha = null;          // sha آخر نسخة قرأناها من GitHub
  var pending = false;     // تغييرات لم تُرفع بعد
  var token = "";

  var app = document.getElementById("app");
  var banner = document.getElementById("banner");
  var syncEl = document.getElementById("sync");

  /* ================= أدوات ================= */
  function el(tag, cls, txt){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt != null) n.textContent = txt;
    return n;
  }
  function say(msg){ banner.textContent = msg || ""; banner.className = msg ? "on" : ""; }
  function setSync(kind, text){
    syncEl.className = "sync " + (kind || "");
    syncEl.querySelector("span").textContent = text;
  }
  function lsGet(k){ try { return window.localStorage.getItem(k); } catch(e){ return null; } }
  function lsSet(k,v){ try { window.localStorage.setItem(k,v); } catch(e){} }
  function lsDel(k){ try { window.localStorage.removeItem(k); } catch(e){} }

  function b64enc(str){
    var bytes = new TextEncoder().encode(str), bin = "";
    for (var i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function b64dec(b64){
    var bin = atob(String(b64).replace(/\s/g,"")), bytes = new Uint8Array(bin.length);
    for (var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  function hex(bytes){
    return Array.prototype.map.call(bytes, function(b){ return ("0"+b.toString(16)).slice(-2); }).join("");
  }
  function unhex(h){
    var a = new Uint8Array(h.length/2);
    for (var i=0;i<a.length;i++) a[i] = parseInt(h.substr(i*2,2),16);
    return a;
  }
  function randBytes(n){
    var a = new Uint8Array(n);
    crypto.getRandomValues(a);
    return a;
  }
  function checkCode(code){
    var enc = new TextEncoder();
    return crypto.subtle.importKey("raw", enc.encode(code), { name:"PBKDF2" }, false, ["deriveBits"])
      .then(function(k){
        return crypto.subtle.deriveBits(
          { name:"PBKDF2", salt: enc.encode(AUTH_SALT), iterations: AUTH_ITER, hash:"SHA-256" }, k, 256);
      })
      .then(function(bits){ return hex(new Uint8Array(bits)) === AUTH_HASH; });
  }
  function keyFrom(pass, salt){
    if (!(window.crypto && crypto.subtle && crypto.subtle.importKey && window.TextEncoder))
      return Promise.reject(new Error("no-crypto"));
    var enc = new TextEncoder();
    return crypto.subtle.importKey("raw", enc.encode(pass), { name:"PBKDF2" }, false, ["deriveKey"])
      .then(function(k){
        return crypto.subtle.deriveKey(
          { name:"PBKDF2", salt: salt, iterations: ITER, hash:"SHA-256" },
          k, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]);
      });
  }
  /* تشفير التوكن بالرمز */
  function seal(pass, secret){
    var salt = randBytes(16), iv = randBytes(12);
    return keyFrom(pass, salt).then(function(key){
      return crypto.subtle.encrypt({ name:"AES-GCM", iv: iv }, key, new TextEncoder().encode(secret));
    }).then(function(buf){
      return { v:1, salt: hex(salt), iv: hex(iv), ct: b64enc_bytes(new Uint8Array(buf)) };
    });
  }
  /* فكّ التشفير — يفشل تلقائياً مع أي رمز خاطئ */
  function openVault(pass, vault){
    return keyFrom(pass, unhex(vault.salt)).then(function(key){
      return crypto.subtle.decrypt({ name:"AES-GCM", iv: unhex(vault.iv) }, key, b64dec_bytes(vault.ct));
    }).then(function(buf){
      return new TextDecoder().decode(buf);
    });
  }
  function b64enc_bytes(bytes){
    var bin = "";
    for (var i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function b64dec_bytes(b64){
    var bin = atob(b64), a = new Uint8Array(bin.length);
    for (var i=0;i<bin.length;i++) a[i] = bin.charCodeAt(i);
    return a;
  }

  /* ================= المزامنة مع GitHub ================= */
  function blankPlayers(){
    var a = [];
    for (var i=0;i<8;i++) a.push({ id:"p"+(i+1), name:"" });
    return a;
  }
  function saveLocal(){ lsSet(LOCAL_KEY, JSON.stringify(state)); }

  function applyData(data){
    if (!data) return false;
    if (data.vault) state.vault = data.vault;
    if (!data.players || data.players.length !== 8) return false;
    state.players = data.players;
    state.schedule = (data.schedule || []).map(function(m){
      if (m.res === undefined) m.res = null;
      return m;
    });
    saveLocal();
    return true;
  }

  function pull(){
    return fetch(API + "?ref=" + GH.branch + "&t=" + Date.now(), {
      headers: { "Accept": "application/vnd.github+json" }, cache: "no-store"
    }).then(function(r){
      if (r.status === 404){ sha = null; return null; }        // الملف ما أُنشئ بعد
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function(j){
      if (!j) return null;
      sha = j.sha;
      return JSON.parse(b64dec(j.content));
    });
  }

  var pushTimer = null;
  function queuePush(){
    pending = true;
    saveLocal();
    setSync("warn", "بانتظار الرفع…");
    clearTimeout(pushTimer);
    pushTimer = setTimeout(function(){ push(); }, 1500);
  }

  function push(retried){
    if (!token){ setSync("warn", "بدون توكن — محلي فقط"); return Promise.resolve(false); }
    setSync("saving", "جارٍ الحفظ…");
    var body = {
      message: "نتائج البادل — " + new Date().toLocaleString("en-GB"),
      content: b64enc(JSON.stringify(state, null, 2)),
      branch: GH.branch
    };
    if (sha) body.sha = sha;
    return fetch(API, {
      method: "PUT",
      headers: {
        "Accept": "application/vnd.github+json",
        "Authorization": "Bearer " + token,
        "Content-Type": "application/json"
      },
      body: JSON.stringify(body)
    }).then(function(r){
      if (r.status === 401 || r.status === 403){
        setSync("err", "التوكن غير صالح");
        say("التوكن مرفوض أو منتهي. جدّده من صفحة الإدارة.");
        return false;
      }
      if ((r.status === 409 || r.status === 422) && !retried){
        return pull().then(function(){ return push(true); });   // تعارض: أعد القراءة وحاول
      }
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json().then(function(j){
        sha = j.content.sha;
        pending = false;
        say("");
        setSync("ok", "محفوظ في GitHub");
        return true;
      });
    }).catch(function(){
      pending = true;
      setSync("warn", "بلا اتصال — محفوظ محلياً");
      return false;
    });
  }

  /* ================= النموذج ================= */
  function nameOf(id){
    for (var i=0;i<state.players.length;i++) if (state.players[i].id === id) return state.players[i].name || "—";
    return "—";
  }
  function buildSchedule(){
    var ids = state.players.map(function(p){ return p.id; });
    for (var i = ids.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = ids[i]; ids[i] = ids[j]; ids[j] = t;
    }
    var out = [];
    ROTATION.forEach(function(round, r){
      round.forEach(function(m, c){
        out.push({
          id: "r"+(r+1)+"c"+(c+1), round: r+1, court: c+1,
          a: [ ids[m[0][0]], ids[m[0][1]] ],
          b: [ ids[m[1][0]], ids[m[1][1]] ],
          res: null
        });
      });
    });
    state.schedule = out;
  }
  function read(m){
    if (!m.res) return { done:false };
    var t = m.res.t;
    return { done:true, winner:m.res.w, label:"2-"+t, winSets:2, loseSets:t,
             ptsWin: t === 0 ? 3 : 2, ptsLose: t === 0 ? 0 : 1 };
  }
  function standings(){
    var rows = {};
    state.players.forEach(function(p){
      rows[p.id] = { id:p.id, name:p.name || "—", pts:0, played:0, w:0, l:0, sw:0, sl:0 };
    });
    state.schedule.forEach(function(m){
      var r = read(m);
      if (!r.done) return;
      [["a", m.a], ["b", m.b]].forEach(function(pair){
        var isWin = r.winner === pair[0];
        pair[1].forEach(function(id){
          var row = rows[id]; if (!row) return;
          row.played++;
          row.sw += isWin ? r.winSets : r.loseSets;
          row.sl += isWin ? r.loseSets : r.winSets;
          if (isWin){ row.w++; row.pts += r.ptsWin; } else { row.l++; row.pts += r.ptsLose; }
        });
      });
    });
    var list = Object.keys(rows).map(function(k){ return rows[k]; });
    list.sort(function(x,y){
      return (y.pts - x.pts) || ((y.sw - y.sl) - (x.sw - x.sl)) || (y.w - x.w) || x.name.localeCompare(y.name, "ar");
    });
    return list;
  }

    });

    function submit(){
      var wait = Math.ceil((blockUntil - Date.now()) / 1000);
      if (wait > 0){ err.textContent = "انتظر " + wait + " ثانية قبل المحاولة."; return; }
      var code = inp.value;
      if (!code) return;
      btn.disabled = true; err.textContent = "جارٍ التحقق…";
      checkCode(code).then(function(ok){
        if (!ok){
          btn.disabled = false; tries++; inp.value = "";
          if (tries >= 3){
            blockUntil = Date.now() + Math.min(60, 5 * Math.pow(2, tries - 3)) * 1000;
            err.textContent = "رمز غير صحيح. جرّب بعد " + Math.ceil((blockUntil - Date.now())/1000) + " ثانية.";
          } else err.textContent = "رمز غير صحيح.";
          inp.focus();
          return;
        }
        unlocked = true; tries = 0; sessionCode = code;
        if (!state.vault){ render(); return; }                 // أول مرة: يربط GitHub من الداخل
        err.textContent = "جارٍ فتح الخزنة…";
        openVault(code, state.vault).then(function(t){
          token = t; setSync("ok", "متصل بـ GitHub"); render();
        }).catch(function(){
          say("تعذّر فكّ الخزنة بهذا الرمز. تقدر تسجّل محلياً، أو تربط توكناً جديداً من الإدارة.");
          render();
        });

        btn.disabled = false;
        err.textContent = "المتصفح ما يدعم التحقق. جرّب متصفحاً أحدث.";
      });
    }
    btn.addEventListener("click", submit);
    inp.addEventListener("keydown", function(e){ if (e.key === "Enter") submit(); });
    g.appendChild(btn); g.appendChild(err);
    frag.appendChild(g);
    setTimeout(function(){ inp.focus(); }, 40);

  function editCard(m){
    var r = read(m);
    var card = el("article","match");
    var top = el("div","match-top");
    top.appendChild(el("span","court-tag","ملعب " + m.court));
    top.appendChild(r.done ? el("span","final", r.label) : el("span","status","بدون نتيجة"));

    function update(next){
      m.res = next;
      queuePush();
      card.replaceWith(editCard(m));
      refreshCounters();
    }

    card.appendChild(courtEl(m, r, true, function(key){
      update({ w:key, t: m.res ? m.res.t : 0 });
    }));

    var bar = el("div","pickbar");
    var seg = el("div","seg");
    [["a",1],["a",0],["b",0],["b",1]].forEach(function(o){
      var side = o[0], type = o[1];
      var on = r.done && m.res.w === side && m.res.t === type;
      var b = el("button", null, "2-" + type);
      b.type = "button";
      b.setAttribute("aria-pressed", String(on));
      b.setAttribute("aria-label", "فوز " + nameOf(m[side][0]) + " و" + nameOf(m[side][1]) + " بنتيجة 2-" + type);
      b.addEventListener("click", function(){ update(on ? null : { w:side, t:type }); });
      seg.appendChild(b);
    });
    bar.appendChild(seg);
    if (r.done){
      var cl = el("button","clear","مسح النتيجة");
      cl.type = "button";
      cl.addEventListener("click", function(){ update(null); });
      bar.appendChild(cl);
    }
    card.appendChild(bar);
    return card;
  }

  function refreshCounters(){
    document.querySelectorAll(".round-head").forEach(function(rh){
      var n = rh.querySelector(".n");
      if (!n) return;
      var r = Number(n.textContent);
      var ms = state.schedule.filter(function(m){ return m.round === r; });
      var s = rh.querySelector(".s");
      if (s) s.textContent = ms.filter(function(m){ return read(m).done; }).length + "/" + ms.length;
    });
  }

  /* ================= التنقل ================= */
  function render(){
    app.innerHTML = "";
    app.appendChild(view === "matches" ? viewMatches() : view === "admin" ? viewAdmin() : viewStandings());
  }
  function syncNav(){
    document.querySelectorAll("nav button").forEach(function(b){
      b.setAttribute("aria-selected", String(b.dataset.view === view));
    });
    document.getElementById("adminkey").classList.toggle("live", view === "admin");
  }
  function go(v){ view = v; syncNav(); render(); window.scrollTo(0, 0); }

  document.querySelectorAll("nav button").forEach(function(b){
    b.addEventListener("click", function(){ go(b.dataset.view); });
  });
  document.getElementById("adminkey").addEventListener("click", function(){
    go(view === "admin" ? "standings" : "admin");
  });

  /* متابعة تلقائية للشباب */
  setInterval(function(){
    if (unlocked || pending) return;
    pull().then(function(d){
      if (applyData(d) && view !== "admin"){ render(); setSync("ok", "محدَّث"); }
    }).catch(function(){});
  }, POLL_MS);

  window.addEventListener("online", function(){ if (pending) push(); });

  /* ================= الإقلاع ================= */
  state.players = blankPlayers();

  pull().then(function(d){
    if (!applyData(d)){
      var local = lsGet(LOCAL_KEY);
      if (local) applyData(JSON.parse(local));
    }
    setSync("", state.vault ? "متصل" : "بانتظار التجهيز");
  }).catch(function(){
    var local = lsGet(LOCAL_KEY);
    if (local) { try { applyData(JSON.parse(local)); } catch(e){} }
    setSync("err", "تعذّر الاتصال بـ GitHub");
  }).then(function(){
    view = "standings";
    syncNav();
    render();
  });
})();
</script>
</body>
</html>
